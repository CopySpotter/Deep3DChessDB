<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deep3DChessDB</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { margin-top: 0; }
    .layout { display: grid; grid-template-columns: minmax(420px, 2fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
    #board { width: 100%; min-height: 420px; background: #ddd; }
    .board-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .view-button { margin: 0; min-width: 64px; }
    .view-button.active { font-weight: 700; outline: 2px solid #555; outline-offset: 1px; }
    .board-view[hidden] { display: none !important; }
    #board2d { width: 90%; aspect-ratio: 1 / 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 1px solid #555; box-sizing: border-box; margin: 0 auto; }
    .square2d { position: relative; margin: 0; padding: 0; border: 0; border-radius: 0; min-width: 0; min-height: 0; width: 100%; height: 100%; aspect-ratio: 1 / 1; font-size: clamp(30px, 5.5vw, 65px); line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .square2d.light {
      background: linear-gradient(145deg, #ffe8c2 0%, #f3c982 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
    }
    .square2d.dark {
      background: linear-gradient(145deg, #d99a6c 0%, #a95f35 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.20);
    }
    .square2d.selected { box-shadow: inset 0 0 0 4px #00e5ff; }
    .square2d .piece {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 78%;
      height: 78%;
    }
    .square2d .piece svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .square2d .piece.white {
      color: #f2f2f2;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
    }
    .square2d .piece.black {
      color: #1b1b1b;
      filter: drop-shadow(0 1px 1px rgba(255,255,255,.08));
    }
    #board2d[data-theme="wood"] { border: 10px solid #4d2f1d; box-shadow: 0 8px 18px rgba(39, 24, 13, .28); }
    #board2d[data-theme="wood"] .square2d.light {
      background: linear-gradient(135deg, #f4d7a2 0%, #d8a968 100%);
      box-shadow: inset 0 0 15px rgba(110, 62, 25, .13);
    }
    #board2d[data-theme="wood"] .square2d.dark {
      background: linear-gradient(135deg, #d5a06a 0%, #b97843 100%);
      box-shadow: inset 0 0 15px rgba(110, 62, 25, .16);
    }
    #board2d[data-theme="wood"] .piece.staunton {
      width: 90%; height: 90%; font-family: Georgia, "Times New Roman", serif;
      font-size: 1.12em; font-weight: 700; line-height: .9;
    }
    #board2d[data-theme="wood"] .piece.staunton.white {
      color: #fff7e6; text-shadow: 0 1px 0 #6e4528, 1px 0 0 #6e4528, -1px 0 0 #6e4528, 0 2px 3px rgba(0,0,0,.42);
    }
    #board2d[data-theme="wood"] .piece.staunton.black {
      color: #25130b; text-shadow: 0 1px 1px rgba(255,235,196,.3), 0 2px 3px rgba(0,0,0,.45);
    }
    .square2d:focus-visible { outline: 3px solid #111; outline-offset: -3px; z-index: 1; }
    .card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    textarea { width: 100%; min-height: 72px; box-sizing: border-box; font: 13px ui-monospace, monospace; }
    button { margin: 8px 6px 0 0; padding: 8px 12px; cursor: pointer; }
    button.candidate-move { margin: 0; padding: 3px 8px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eee; font-size: 14px; }
    code, pre { font-family: ui-monospace, monospace; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 10px; border-radius: 6px; max-height: 260px; overflow: auto; }
    .muted { color: #666; font-size: 13px; }
    .game-state { min-height: 1.4em; margin-top: 10px; font-weight: 650; }
    .status { min-height: 1.4em; margin-top: 3px; }
    @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } #board { min-height: 320px; } }
  </style>
</head>
<body>
<main>
  <h1>Deep3DChessDB</h1>
  <p class="muted">Spielbares 2D/3D-Brett mit legalen Schachzügen und ChessDB-Cloudanalyse. Beide Ansichten teilen dieselbe Stellung, FEN und Analyse.</p>
  <div class="layout">
    <div class="card">
      <div class="board-toolbar" aria-label="Brettansicht">
        <button type="button" id="view3d" class="view-button active" aria-pressed="true">3D</button>
        <button type="button" id="view2d" class="view-button" aria-pressed="false">2D</button>
        <button type="button" id="theme2d" class="view-button" hidden>Holz / Staunton</button>
      </div>
      <div id="board3dView" class="board-view"><div id="board"></div></div>
      <div id="board2dView" class="board-view" hidden><div id="board2d" aria-label="2D-Schachbrett"></div></div>
    </div>
    <div class="card">
      <label for="fen"><strong>FEN</strong></label>
      <textarea id="fen">rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1</textarea>
      <div>
        <button id="show">Am Brett anzeigen</button>
        <button id="analyse">ChessDB analysieren</button>
        <button id="pv">PV</button>
        <button id="deepen">Deepen</button>
        <button id="flip">Brett drehen</button>
      </div>
      <div class="game-state" id="gameState" aria-live="polite"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div id="moves"></div>
      <pre id="raw" hidden></pre>
    </div>
  </div>
</main>

<!-- chessboard3.js was built for the classic THREE global API (tested around r80). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/80/three.min.js"></script>
<!-- OrbitControls from the same three.js generation keep rotation/zoom inside the 3D canvas. -->
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r80/examples/js/controls/OrbitControls.js"></script>
<!-- chess.js provides legal move validation and complete FEN state. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="js/chessboard3.js"></script>
<script src="js/chessboard3.chessdb.js"></script>
<script>
(function () {
  var fenEl = document.getElementById('fen');
  var statusEl = document.getElementById('status');
  var gameStateEl = document.getElementById('gameState');
  var movesEl = document.getElementById('moves');
  var rawEl = document.getElementById('raw');
  var board2dEl = document.getElementById('board2d');
  var board3dViewEl = document.getElementById('board3dView');
  var board2dViewEl = document.getElementById('board2dView');
  var view3dEl = document.getElementById('view3d');
  var view2dEl = document.getElementById('view2d');
  var theme2dEl = document.getElementById('theme2d');
  var game = new Chess();
  var pendingMove = null;
  var selected2dSquare = null;
  var boardOrientation = 'white';
  var board2dTheme = 'bauhaus';
  var analysisGeneration = 0;
  var cdb;

  function pieceSVG(type, colorClass) {
    var shapes = {
      p: '<circle cx="50" cy="28" r="14" fill="currentColor"/>' +
         '<rect x="38" y="44" width="24" height="18" rx="3" fill="currentColor"/>' +
         '<rect x="28" y="66" width="44" height="10" rx="2" fill="currentColor"/>' +
         '<rect x="22" y="80" width="56" height="8" rx="2" fill="currentColor"/>',
      r: '<rect x="26" y="18" width="10" height="12" fill="currentColor"/>' +
         '<rect x="45" y="18" width="10" height="12" fill="currentColor"/>' +
         '<rect x="64" y="18" width="10" height="12" fill="currentColor"/>' +
         '<rect x="24" y="32" width="52" height="14" rx="2" fill="currentColor"/>' +
         '<rect x="32" y="46" width="36" height="26" rx="2" fill="currentColor"/>' +
         '<rect x="24" y="76" width="52" height="8" rx="2" fill="currentColor"/>' +
         '<rect x="20" y="86" width="60" height="6" rx="2" fill="currentColor"/>',
      n: '<path d="M30 80 L30 55 L42 28 L68 28 L58 45 L72 80 Z" fill="currentColor"/>' +
         '<circle cx="56" cy="38" r="3" fill="#ffffff"/>' +
         '<rect x="24" y="84" width="56" height="6" rx="2" fill="currentColor"/>',
      b: '<circle cx="50" cy="20" r="6" fill="currentColor"/>' +
         '<path d="M50 28 L66 44 L58 78 L42 78 L34 44 Z" fill="currentColor"/>' +
         '<rect x="28" y="80" width="44" height="8" rx="2" fill="currentColor"/>' +
         '<rect x="22" y="90" width="56" height="4" rx="2" fill="currentColor"/>',
      q: '<circle cx="26" cy="24" r="5" fill="currentColor"/>' +
         '<circle cx="50" cy="18" r="6" fill="currentColor"/>' +
         '<circle cx="74" cy="24" r="5" fill="currentColor"/>' +
         '<path d="M24 32 L36 52 L50 36 L64 52 L76 32 L68 78 L32 78 Z" fill="currentColor"/>' +
         '<rect x="24" y="80" width="52" height="8" rx="2" fill="currentColor"/>' +
         '<rect x="18" y="90" width="64" height="4" rx="2" fill="currentColor"/>',
      k: '<rect x="46" y="12" width="8" height="18" fill="currentColor"/>' +
         '<rect x="38" y="20" width="24" height="8" fill="currentColor"/>' +
         '<path d="M34 34 H66 V48 H58 V78 H42 V48 H34 Z" fill="currentColor"/>' +
         '<rect x="28" y="80" width="44" height="8" rx="2" fill="currentColor"/>' +
         '<rect x="22" y="90" width="56" height="4" rx="2" fill="currentColor"/>'
    };

    return '<span aria-hidden="true" class="piece ' + colorClass + '">' +
      '<svg viewBox="0 0 100 100" role="img" focusable="false">' +
      shapes[type] +
      '</svg></span>';
  }

  function pieceLabel(piece) {
    if (!piece) return 'leeres Feld';
    var names = { p: 'Bauer', n: 'Springer', b: 'Läufer', r: 'Turm', q: 'Dame', k: 'König' };
    return (piece.color === 'w' ? 'weißer ' : 'schwarzer ') + names[piece.type];
  }

  function pieceStaunton(type, colorClass) {
    var symbols = {
      w: { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕', k: '♔' },
      b: { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' }
    };
    var color = colorClass === 'white' ? 'w' : 'b';
    return '<span aria-hidden="true" class="piece staunton ' + colorClass + '">' + symbols[color][type] + '</span>';
  }

  function setBoardView(view) {
    var show2d = view === '2d';
    board2dViewEl.hidden = !show2d;
    board3dViewEl.hidden = show2d;
    view2dEl.classList.toggle('active', show2d);
    view3dEl.classList.toggle('active', !show2d);
    view2dEl.setAttribute('aria-pressed', show2d ? 'true' : 'false');
    view3dEl.setAttribute('aria-pressed', show2d ? 'false' : 'true');
    theme2dEl.hidden = !show2d;
    if (!show2d) setTimeout(function () { board.resize(); }, 0);
  }

  function render2DBoard() {
    if (!board2dEl) return;
    board2dEl.setAttribute('data-theme', board2dTheme);
    var files = boardOrientation === 'white' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
    var ranks = boardOrientation === 'white' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
    var html = '';

    ranks.forEach(function (rank) {
      files.forEach(function (file) {
        var square = file + rank;
        var piece = game.get(square);
        var fileIndex = file.charCodeAt(0) - 97;
        var dark = (fileIndex + rank) % 2 === 1;
        var selected = selected2dSquare === square ? ' selected' : '';
        var pieceClass = piece ? (piece.color === 'w' ? 'white' : 'black') : '';
        var pieceHtml = piece ? (board2dTheme === 'wood' ? pieceStaunton(piece.type, pieceClass) : pieceSVG(piece.type, pieceClass)) : '';
        html += '<button type="button" class="square2d ' + (dark ? 'dark' : 'light') + selected +
          '" data-square="' + square + '" aria-label="' + square + ', ' + pieceLabel(piece) + '">' +
          pieceHtml + '</button>';
      });
    });

    board2dEl.innerHTML = html;
  }

  function play2DMove(source, target) {
    var move = null;
    try {
      move = game.move({ from: source, to: target, promotion: 'q' });
    } catch (e) {
      move = null;
    }

    if (move === null) return null;

    analysisGeneration++;
    pendingMove = null;
    selected2dSquare = null;
    fenEl.value = game.fen();
    board.position(game.fen(), false);
    render2DBoard();
    updateGameState();
    movesEl.innerHTML = '';
    rawEl.hidden = true;
    statusEl.textContent = move.san + ' gespielt – ChessDB wird aktualisiert …';

    setTimeout(function () {
      computeCurrentPosition(false).catch(function () {});
    }, 0);

    return move;
  }

  board2dEl.addEventListener('click', function (event) {
    var button = event.target.closest ? event.target.closest('.square2d') : null;
    if (!button) return;
    var square = button.getAttribute('data-square');
    var piece = game.get(square);

    if (typeof game.game_over === 'function' && game.game_over()) {
      updateGameState();
      statusEl.textContent = 'Die Partie ist beendet.';
      return;
    }

    if (!selected2dSquare) {
      if (!piece || piece.color !== game.turn()) {
        statusEl.textContent = 'Bitte eine eigene Figur auswählen.';
        return;
      }
      selected2dSquare = square;
      render2DBoard();
      statusEl.textContent = square + ' ausgewählt.';
      return;
    }

    if (square === selected2dSquare) {
      selected2dSquare = null;
      render2DBoard();
      statusEl.textContent = 'Auswahl aufgehoben.';
      return;
    }

    if (play2DMove(selected2dSquare, square)) return;

    if (piece && piece.color === game.turn()) {
      selected2dSquare = square;
      render2DBoard();
      statusEl.textContent = square + ' ausgewählt.';
      return;
    }

    statusEl.textContent = 'Illegaler Zug.';
  });

  view3dEl.addEventListener('click', function () { setBoardView('3d'); });
  view2dEl.addEventListener('click', function () { setBoardView('2d'); });
  theme2dEl.addEventListener('click', function () {
    board2dTheme = board2dTheme === 'bauhaus' ? 'wood' : 'bauhaus';
    theme2dEl.textContent = board2dTheme === 'wood' ? 'Bauhaus / SVG' : 'Holz / Staunton';
    render2DBoard();
  });

  function isBoardSquare(square) {
    return /^[a-h][1-8]$/.test(String(square || ''));
  }

  function pieceMatchesTurn(piece) {
    return piece && piece.charAt(0) === game.turn();
  }

  function colorName(color) {
    return color === 'w' ? 'Weiß' : 'Schwarz';
  }

  function updateGameState() {
    if (typeof game.in_checkmate === 'function' && game.in_checkmate()) {
      gameStateEl.textContent = 'Schachmatt – ' + colorName(game.turn() === 'w' ? 'b' : 'w') + ' gewinnt.';
      return;
    }
    if (typeof game.in_stalemate === 'function' && game.in_stalemate()) {
      gameStateEl.textContent = 'Patt – Remis.';
      return;
    }
    if (typeof game.insufficient_material === 'function' && game.insufficient_material()) {
      gameStateEl.textContent = 'Remis – unzureichendes Material.';
      return;
    }
    if (typeof game.in_threefold_repetition === 'function' && game.in_threefold_repetition()) {
      gameStateEl.textContent = 'Remis – dreifache Stellungswiederholung.';
      return;
    }
    if (typeof game.in_draw === 'function' && game.in_draw()) {
      gameStateEl.textContent = 'Remis.';
      return;
    }
    if (typeof game.in_check === 'function' && game.in_check()) {
      gameStateEl.textContent = colorName(game.turn()) + ' steht im Schach.';
      return;
    }
    gameStateEl.textContent = colorName(game.turn()) + ' am Zug.';
  }

  // chessboard3.js creates the coordinates as real 3D text meshes on all four edges.
  // Keep that native 3D notation, but make it smaller/closer and show only one file edge
  // and one rank edge at a time. No HTML labels are placed around the canvas.
  function tune3DNotation(scene) {
    if (!scene || !scene.children) return;

    var camera = null;
    scene.children.forEach(function (obj) {
      if (!camera && obj instanceof THREE.PerspectiveCamera) camera = obj;
    });
    if (!camera) return;

    var preferPositiveZ = camera.position.z >= 0;
    var preferPositiveX;
    if (Math.abs(camera.position.x) < 0.35) {
      // Straight white view: numbers on the visually left edge.
      preferPositiveX = false;
    } else {
      preferPositiveX = camera.position.x > 0;
    }

    scene.children.forEach(function (obj) {
      if (!obj || !obj.geometry || !obj.position) return;

      var isFileLabel = Math.abs(obj.position.z) > 8.4 && Math.abs(obj.position.x) < 8.4;
      var isRankLabel = Math.abs(obj.position.x) > 8.4 && Math.abs(obj.position.z) < 8.4;
      if (!isFileLabel && !isRankLabel) return;

      obj.scale.set(0.64, 0.64, 0.64);

      if (isFileLabel) {
        var positiveZ = obj.position.z > 0;
        obj.position.z = positiveZ ? 8.55 : -8.55;
        obj.visible = positiveZ === preferPositiveZ;
      } else {
        var positiveX = obj.position.x > 0;
        obj.position.x = positiveX ? 8.55 : -8.55;
        obj.visible = positiveX === preferPositiveX;
      }
    });
  }

  var board = new ChessBoard3('board', {
    position: 'start',
    draggable: true,
    rotateControls: true,
    zoomControls: true,
    pieceSet: 'assets/chesspieces/classic/{piece}.json',
    onRender: function (scene) {
      tune3DNotation(scene);
    },
    onDragStart: function (source, piece) {
      if (!isBoardSquare(source)) return false;
      if (typeof game.game_over === 'function' && game.game_over()) return false;
      return pieceMatchesTurn(piece);
    },
    onDrop: function (source, target) {
      if (!isBoardSquare(source) || !isBoardSquare(target)) return 'snapback';

      var move = null;
      try {
        move = game.move({ from: source, to: target, promotion: 'q' });
      } catch (e) {
        move = null;
      }

      if (move === null) {
        statusEl.textContent = 'Illegaler Zug – Figur wurde zurückgesetzt.';
        return 'snapback';
      }

      pendingMove = move;
      fenEl.value = game.fen();
    },
    onSnapEnd: function () {
      if (!pendingMove) return;
      var san = pendingMove.san;
      pendingMove = null;

      // Synchronisiert Sonderzüge wie Rochade, en passant und Umwandlung.
      board.position(game.fen(), false);
      selected2dSquare = null;
      render2DBoard();
      updateGameState();
      statusEl.textContent = san + ' gespielt – ChessDB wird aktualisiert …';
      setTimeout(function () { computeCurrentPosition(false); }, 0);
    }
  });

  // Font/notation is loaded asynchronously; these rerenders catch it without changing layout.
  setTimeout(function () { board.rerender(); }, 300);
  setTimeout(function () { board.rerender(); }, 900);

  cdb = ChessBoard3ChessDB.attach(board, {
    endpoint: 'chessdb-proxy.php',
    learn: true,
    getFen: function () { return fenEl.value.trim(); }
  });

  function loadFenFromInput(animate) {
    var fen = fenEl.value.trim();
    var loaded = false;
    try {
      loaded = game.load(fen);
    } catch (e) {
      loaded = false;
    }
    if (!loaded) throw new Error('Ungültige FEN.');

    fenEl.value = game.fen();
    board.position(game.fen(), animate !== false);
    selected2dSquare = null;
    render2DBoard();
    updateGameState();
    return game.fen();
  }

  function busy(text) {
    statusEl.textContent = text;
    movesEl.innerHTML = '';
    rawEl.hidden = true;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function formatScore(score) {
    if (score == null || score === '' || score === '??') return '??';
    var n = Number(score);
    if (!Number.isFinite(n)) return String(score);
    return (n / 100).toFixed(2);
  }

  function parseUci(uci) {
    var match = /^([a-h][1-8])([a-h][1-8])([qrbn])?$/i.exec(String(uci || '').trim());
    if (!match) return null;
    return {
      from: match[1].toLowerCase(),
      to: match[2].toLowerCase(),
      promotion: match[3] ? match[3].toLowerCase() : null
    };
  }

  function playCandidateMove(uci) {
    var spec = parseUci(uci);
    if (!spec) {
      statusEl.textContent = 'ChessDB-Zug konnte nicht gelesen werden.';
      return;
    }
    if (typeof game.game_over === 'function' && game.game_over()) {
      updateGameState();
      statusEl.textContent = 'Die Partie ist beendet.';
      return;
    }

    var move = null;
    try {
      move = game.move({
        from: spec.from,
        to: spec.to,
        promotion: spec.promotion || 'q'
      });
    } catch (e) {
      move = null;
    }

    if (move === null) {
      statusEl.textContent = 'Dieser ChessDB-Zug ist in der aktuellen Stellung nicht legal – bitte neu analysieren.';
      return;
    }

    analysisGeneration++;
    pendingMove = null;
    fenEl.value = game.fen();

    // Promotions are synchronized instantly because chessboard3.js identifies animation
    // pieces by type and could otherwise animate an existing queen/rook/bishop/knight.
    board.position(game.fen(), spec.promotion ? false : true);
    selected2dSquare = null;
    render2DBoard();
    updateGameState();
    movesEl.innerHTML = '';
    rawEl.hidden = true;
    statusEl.textContent = move.san + ' aus ChessDB gespielt – Analyse wird aktualisiert …';

    setTimeout(function () {
      computeCurrentPosition(false).catch(function () {});
    }, spec.promotion ? 0 : 240);
  }

  function renderMoves(result) {
    var moves = ChessBoard3ChessDB.normalizeMoves(result);
    if (!moves.length) {
      movesEl.innerHTML = '<p>Keine Zugliste im Ergebnis.</p>';
      rawEl.textContent = JSON.stringify(result, null, 2);
      rawEl.hidden = false;
      return;
    }
    var html = '<table><thead><tr><th>Zug</th><th>Score</th><th>Rank</th><th>Winrate</th><th>Note</th></tr></thead><tbody>';
    moves.slice(0, 12).forEach(function (m) {
      var uci = m.uci || m.move || '';
      var label = m.san || uci || m.move || '?';
      html += '<tr><td><button type="button" class="candidate-move" data-uci="' + esc(uci) + '"' +
        (parseUci(uci) ? '' : ' disabled') + '>' + esc(label) + '</button></td>' +
        '<td>' + esc(formatScore(m.score)) + '</td>' +
        '<td>' + esc(m.rank) + '</td><td>' + esc(m.winrate) + '</td><td>' + esc(m.note) + '</td></tr>';
    });
    html += '</tbody></table>';
    movesEl.innerHTML = html;
  }

  movesEl.addEventListener('click', function (event) {
    var target = event.target;
    if (!target || !target.classList || !target.classList.contains('candidate-move')) return;
    playCandidateMove(target.getAttribute('data-uci'));
  });

  document.getElementById('show').onclick = function () {
    analysisGeneration++;
    try {
      loadFenFromInput(true);
      statusEl.textContent = 'Stellung geladen. Figuren können legal gezogen werden.';
    } catch (e) {
      statusEl.textContent = e.message;
    }
  };

  document.getElementById('flip').onclick = function () {
    board.flip();
    boardOrientation = board.orientation();
    selected2dSquare = null;
    render2DBoard();
  };

  function computeCurrentPosition(reloadFen) {
    var generation = ++analysisGeneration;
    var fen;

    try {
      fen = reloadFen === false ? game.fen() : loadFenFromInput(true);
    } catch (e) {
      statusEl.textContent = e.message;
      return Promise.reject(e);
    }

    updateGameState();
    busy('ChessDB wird abgefragt …');
    fenEl.value = fen;

    return cdb.compute(fen, {
      interval: 5000,
      maxAttempts: 12,
      onProgress: function (p) {
        if (generation !== analysisGeneration) return;
        if (p.phase === 'queue') {
          statusEl.textContent = 'Stellung noch unbekannt – ChessDB-Analyse wird angefordert …';
        } else if (p.phase === 'queued') {
          statusEl.textContent = 'Analyse eingereiht. Neue Abfrage in ' + p.seconds + ' Sekunden …';
        } else if (p.phase === 'query') {
          statusEl.textContent = 'ChessDB wird erneut abgefragt … (' + p.attempt + '/' + p.maxAttempts + ')';
        } else if (p.phase === 'waiting') {
          statusEl.textContent = 'Noch in Berechnung. Nächste Abfrage in ' + p.seconds + ' Sekunden … (' + p.attempt + '/' + p.maxAttempts + ')';
        }
      }
    }).then(function (r) {
      if (generation !== analysisGeneration) return r;
      if (r.status === 'pending') {
        statusEl.textContent = 'ChessDB rechnet noch. Später erneut auf „ChessDB analysieren“ klicken.';
        rawEl.textContent = JSON.stringify(r, null, 2);
        rawEl.hidden = false;
      } else {
        statusEl.textContent = r.status === 'ok' ? 'ChessDB-Ergebnis – Zug anklicken zum Ausführen.' : ('ChessDB: ' + (r.status || 'Antwort'));
        renderMoves(r);
      }
      return r;
    }).catch(function (e) {
      if (generation === analysisGeneration) statusEl.textContent = 'Fehler: ' + e.message;
      throw e;
    });
  }

  document.getElementById('analyse').onclick = function () {
    computeCurrentPosition(true).catch(function () {});
  };

  document.getElementById('pv').onclick = function () {
    var generation = ++analysisGeneration;
    var fen;
    try {
      fen = loadFenFromInput(false);
    } catch (e) {
      statusEl.textContent = e.message;
      return;
    }
    busy('PV wird abgefragt …');
    cdb.pv(fen).then(function (r) {
      if (generation !== analysisGeneration) return;
      statusEl.textContent = 'Principal Variation';
      rawEl.textContent = typeof r.raw === 'string' ? r.raw : JSON.stringify(r, null, 2);
      rawEl.hidden = false;
    }).catch(function (e) {
      if (generation === analysisGeneration) statusEl.textContent = 'Fehler: ' + e.message;
    });
  };

  document.getElementById('deepen').onclick = function () {
    var generation = ++analysisGeneration;
    var fen;
    try {
      fen = loadFenFromInput(false);
    } catch (e) {
      statusEl.textContent = e.message;
      return;
    }
    busy('Stellung wird zur ChessDB-Analyse eingereiht …');
    cdb.deepen(fen).then(function (r) {
      if (generation !== analysisGeneration) return r;
      if (r.status === 'ok') {
        statusEl.textContent = 'Deepen akzeptiert. Automatische Kontrolle startet in 5 Sekunden …';
        return new Promise(function (resolve) { setTimeout(resolve, 5000); }).then(function () {
          if (generation === analysisGeneration) return computeCurrentPosition(false);
          return r;
        });
      }
      statusEl.textContent = 'ChessDB hat geantwortet.';
      rawEl.textContent = JSON.stringify(r, null, 2);
      rawEl.hidden = false;
      return r;
    }).catch(function (e) {
      if (generation === analysisGeneration) statusEl.textContent = 'Fehler: ' + e.message;
    });
  };

  boardOrientation = board.orientation();
  render2DBoard();
  setBoardView('3d');
  updateGameState();
  window.addEventListener('resize', function () { board.resize(); });
})();
</script>
</body>
</html>
