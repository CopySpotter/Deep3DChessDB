<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deep3DChessDB</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { margin-top: 0; }
    .layout { display: grid; grid-template-columns: minmax(420px, 2fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
    #board { width: 100%; min-height: 420px; background: #ddd; }
    .card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    textarea { width: 100%; min-height: 72px; box-sizing: border-box; font: 13px ui-monospace, monospace; }
    button { margin: 8px 6px 0 0; padding: 8px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eee; font-size: 14px; }
    code, pre { font-family: ui-monospace, monospace; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 10px; border-radius: 6px; max-height: 260px; overflow: auto; }
    .muted { color: #666; font-size: 13px; }
    .status { min-height: 1.4em; margin-top: 8px; }
    @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } #board { min-height: 320px; } }
  </style>
</head>
<body>
<main>
  <h1>Deep3DChessDB</h1>
  <p class="muted">Spielbares 3D-Brett mit legalen Schachzügen und ChessDB-Cloudanalyse. Nach jedem legalen Zug wird die vollständige FEN aktualisiert und ChessDB automatisch neu abgefragt.</p>
  <div class="layout">
    <div class="card"><div id="board"></div></div>
    <div class="card">
      <label for="fen"><strong>FEN</strong></label>
      <textarea id="fen">rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1</textarea>
      <div>
        <button id="show">Am Brett anzeigen</button>
        <button id="analyse">ChessDB analysieren</button>
        <button id="pv">PV</button>
        <button id="deepen">Deepen</button>
        <button id="flip">Brett drehen</button>
      </div>
      <div class="status" id="status"></div>
      <div id="moves"></div>
      <pre id="raw" hidden></pre>
    </div>
  </div>
</main>

<!-- chessboard3.js was built for the classic THREE global API (tested around r80). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/80/three.min.js"></script>
<!-- OrbitControls from the same three.js generation keep rotation/zoom inside the 3D canvas. -->
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r80/examples/js/controls/OrbitControls.js"></script>
<!-- chess.js provides legal move validation and complete FEN state. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="js/chessboard3.js"></script>
<script src="js/chessboard3.chessdb.js"></script>
<script>
(function () {
  var fenEl = document.getElementById('fen');
  var statusEl = document.getElementById('status');
  var movesEl = document.getElementById('moves');
  var rawEl = document.getElementById('raw');
  var game = new Chess();
  var pendingMove = null;
  var analysisGeneration = 0;
  var cdb;

  function isBoardSquare(square) {
    return /^[a-h][1-8]$/.test(String(square || ''));
  }

  function pieceMatchesTurn(piece) {
    return piece && piece.charAt(0) === game.turn();
  }

  var board = new ChessBoard3('board', {
    position: 'start',
    draggable: true,
    rotateControls: true,
    zoomControls: true,
    pieceSet: 'assets/chesspieces/classic/{piece}.json',
    onDragStart: function (source, piece) {
      if (!isBoardSquare(source)) return false;
      if (typeof game.game_over === 'function' && game.game_over()) return false;
      return pieceMatchesTurn(piece);
    },
    onDrop: function (source, target) {
      if (!isBoardSquare(source) || !isBoardSquare(target)) return 'snapback';

      var move = null;
      try {
        move = game.move({ from: source, to: target, promotion: 'q' });
      } catch (e) {
        move = null;
      }

      if (move === null) {
        statusEl.textContent = 'Illegaler Zug – Figur wurde zurückgesetzt.';
        return 'snapback';
      }

      pendingMove = move;
      fenEl.value = game.fen();
    },
    onSnapEnd: function () {
      if (!pendingMove) return;
      var san = pendingMove.san;
      pendingMove = null;

      // Synchronisiert Sonderzüge wie Rochade, en passant und Umwandlung.
      board.position(game.fen(), false);
      statusEl.textContent = san + ' gespielt – ChessDB wird aktualisiert …';
      setTimeout(function () { computeCurrentPosition(false); }, 0);
    }
  });

  cdb = ChessBoard3ChessDB.attach(board, {
    endpoint: 'chessdb-proxy.php',
    learn: true,
    getFen: function () { return fenEl.value.trim(); }
  });

  function loadFenFromInput(animate) {
    var fen = fenEl.value.trim();
    var loaded = false;
    try {
      loaded = game.load(fen);
    } catch (e) {
      loaded = false;
    }
    if (!loaded) throw new Error('Ungültige FEN.');

    fenEl.value = game.fen();
    board.position(game.fen(), animate !== false);
    return game.fen();
  }

  function busy(text) {
    statusEl.textContent = text;
    movesEl.innerHTML = '';
    rawEl.hidden = true;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function formatScore(score) {
    if (score == null || score === '' || score === '??') return '??';
    var n = Number(score);
    if (!Number.isFinite(n)) return String(score);
    return (n / 100).toFixed(2);
  }

  function renderMoves(result) {
    var moves = ChessBoard3ChessDB.normalizeMoves(result);
    if (!moves.length) {
      movesEl.innerHTML = '<p>Keine Zugliste im Ergebnis.</p>';
      rawEl.textContent = JSON.stringify(result, null, 2);
      rawEl.hidden = false;
      return;
    }
    var html = '<table><thead><tr><th>Zug</th><th>Score</th><th>Rank</th><th>Winrate</th><th>Note</th></tr></thead><tbody>';
    moves.slice(0, 12).forEach(function (m) {
      html += '<tr><td><strong>' + esc(m.san || m.uci || m.move) + '</strong></td>' +
        '<td>' + esc(formatScore(m.score)) + '</td>' +
        '<td>' + esc(m.rank) + '</td><td>' + esc(m.winrate) + '</td><td>' + esc(m.note) + '</td></tr>';
    });
    html += '</tbody></table>';
    movesEl.innerHTML = html;
  }

  document.getElementById('show').onclick = function () {
    analysisGeneration++;
    try {
      loadFenFromInput(true);
      statusEl.textContent = 'Stellung geladen. Figuren können legal gezogen werden.';
    } catch (e) {
      statusEl.textContent = e.message;
    }
  };

  document.getElementById('flip').onclick = function () {
    board.flip();
  };

  function computeCurrentPosition(reloadFen) {
    var generation = ++analysisGeneration;
    var fen;

    try {
      fen = reloadFen === false ? game.fen() : loadFenFromInput(true);
    } catch (e) {
      statusEl.textContent = e.message;
      return Promise.reject(e);
    }

    busy('ChessDB wird abgefragt …');
    fenEl.value = fen;

    return cdb.compute(fen, {
      interval: 5000,
      maxAttempts: 12,
      onProgress: function (p) {
        if (generation !== analysisGeneration) return;
        if (p.phase === 'queue') {
          statusEl.textContent = 'Stellung noch unbekannt – ChessDB-Analyse wird angefordert …';
        } else if (p.phase === 'queued') {
          statusEl.textContent = 'Analyse eingereiht. Neue Abfrage in ' + p.seconds + ' Sekunden …';
        } else if (p.phase === 'query') {
          statusEl.textContent = 'ChessDB wird erneut abgefragt … (' + p.attempt + '/' + p.maxAttempts + ')';
        } else if (p.phase === 'waiting') {
          statusEl.textContent = 'Noch in Berechnung. Nächste Abfrage in ' + p.seconds + ' Sekunden … (' + p.attempt + '/' + p.maxAttempts + ')';
        }
      }
    }).then(function (r) {
      if (generation !== analysisGeneration) return r;
      if (r.status === 'pending') {
        statusEl.textContent = 'ChessDB rechnet noch. Später erneut auf „ChessDB analysieren“ klicken.';
        rawEl.textContent = JSON.stringify(r, null, 2);
        rawEl.hidden = false;
      } else {
        statusEl.textContent = r.status === 'ok' ? 'ChessDB-Ergebnis' : ('ChessDB: ' + (r.status || 'Antwort'));
        renderMoves(r);
      }
      return r;
    }).catch(function (e) {
      if (generation === analysisGeneration) statusEl.textContent = 'Fehler: ' + e.message;
      throw e;
    });
  }

  document.getElementById('analyse').onclick = function () {
    computeCurrentPosition(true).catch(function () {});
  };

  document.getElementById('pv').onclick = function () {
    var generation = ++analysisGeneration;
    var fen;
    try {
      fen = loadFenFromInput(false);
    } catch (e) {
      statusEl.textContent = e.message;
      return;
    }
    busy('PV wird abgefragt …');
    cdb.pv(fen).then(function (r) {
      if (generation !== analysisGeneration) return;
      statusEl.textContent = 'Principal Variation';
      rawEl.textContent = typeof r.raw === 'string' ? r.raw : JSON.stringify(r, null, 2);
      rawEl.hidden = false;
    }).catch(function (e) {
      if (generation === analysisGeneration) statusEl.textContent = 'Fehler: ' + e.message;
    });
  };

  document.getElementById('deepen').onclick = function () {
    var generation = ++analysisGeneration;
    var fen;
    try {
      fen = loadFenFromInput(false);
    } catch (e) {
      statusEl.textContent = e.message;
      return;
    }
    busy('Stellung wird zur ChessDB-Analyse eingereiht …');
    cdb.deepen(fen).then(function (r) {
      if (generation !== analysisGeneration) return r;
      if (r.status === 'ok') {
        statusEl.textContent = 'Deepen akzeptiert. Automatische Kontrolle startet in 5 Sekunden …';
        return new Promise(function (resolve) { setTimeout(resolve, 5000); }).then(function () {
          if (generation === analysisGeneration) return computeCurrentPosition(false);
          return r;
        });
      }
      statusEl.textContent = 'ChessDB hat geantwortet.';
      rawEl.textContent = JSON.stringify(r, null, 2);
      rawEl.hidden = false;
      return r;
    }).catch(function (e) {
      if (generation === analysisGeneration) statusEl.textContent = 'Fehler: ' + e.message;
    });
  };

  window.addEventListener('resize', function () { board.resize(); });
})();
</script>
</body>
</html>
